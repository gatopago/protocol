<?xml version="1.0" encoding="UTF-8" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="455px" preserveAspectRatio="none" style="width:627px;height:455px;background:#FFFFFF;" version="1.1" viewBox="0 0 627 455" width="627px" zoomAndPan="magnify"><defs/><g><!--entity pk--><g id="elem_pk"><rect fill="#F1F1F1" height="55.2188" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="325" x="233" y="5.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="53" x="243" y="29.752">Passkey</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="305" x="243" y="47.3613">(fingerprint or face, synced by iCloud or Google)</text></g><!--entity prf--><g id="elem_prf"><rect fill="#F1F1F1" height="55.2188" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="301" x="9" y="114.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="72" x="19" y="138.752">PRF output</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="281" x="19" y="156.3613">(32 bytes, always the same for that passkey)</text></g><!--entity seed--><g id="elem_seed"><rect fill="#F1F1F1" height="37.6094" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="97" x="111" y="216.7188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="77" x="121" y="241.252">BIP-39 seed</text></g><!--entity evm--><g id="elem_evm"><rect fill="#F1F1F1" height="55.2188" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="116" x="50.5" y="302.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="55" x="60.5" y="326.752">EVM key</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="96" x="60.5" y="344.3613">m/44'/60'/0'/0/0</text></g><!--entity xlm--><g id="elem_xlm"><rect fill="#F1F1F1" height="55.2188" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="144" x="192.5" y="302.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="66" x="202.5" y="326.752">Stellar key</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="124" x="202.5" y="344.3613">SEP-5 m/44'/148'/0'</text></g><!--entity biz--><g id="elem_biz"><rect fill="#F1F1F1" height="55.2188" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="293" x="328" y="114.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="83" x="338" y="138.752">Business key</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="273" x="338" y="156.3613">(another salt, only to sign in to the console)</text></g><!--entity account--><g id="elem_account"><rect fill="#F1F1F1" height="55.2188" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="171" x="7" y="394.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="151" x="17" y="418.752">GatoPago EVM account</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="130" x="17" y="436.3613">(the key is its owner)</text></g><!--entity sa--><g id="elem_sa"><rect fill="#F1F1F1" height="55.2188" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="153" x="196" y="394.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="133" x="206" y="418.752">Stellar smart account</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="131" x="206" y="436.3613">(the key is its signer)</text></g><g id="elem_GMN17"><path d="M226.5,206.2188 L226.5,265.2734 L552.5,265.2734 L552.5,216.2188 L542.5,206.2188 L226.5,206.2188 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M542.5,206.2188 L542.5,216.2188 L552.5,216.2188 L542.5,206.2188 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="305" x="232.5" y="224.7139">No phrase to write down: the passkey regenerates it.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="256" x="232.5" y="241.0654">Keys live in memory; one fingerprint opens a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232" x="232.5" y="257.417">15-minute session without asking again.</text></g><path d="M336.8597,60.3057 C300.6839,76.7074 254.4433,97.6724 218.2476,114.0832 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="218.2476,114.0832,228.0962,114.0099,222.8014,112.0185,224.7927,106.7238,218.2476,114.0832" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="91" x="293.5" y="92.7139">WebAuthn PRF</text><path d="M415.2313,60.4434 C427.2965,76.7849 442.6772,97.617 454.7465,113.964 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="454.7465,113.964,452.6187,104.3477,451.7766,109.9416,446.1828,109.0995,454.7465,113.964" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="125" x="441.5" y="92.7139">PRF with another salt</text><path d="M159.5,169.329 C159.5,184.5066 159.5,203.1313 159.5,216.6163 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="159.5,216.6163,163.5,207.6163,159.5,211.6163,155.5,207.6163,159.5,216.6163" style="stroke:#181818;stroke-width:1.0;"/><path d="M149.424,254.895 C141.9345,268.4055 131.6015,287.0454 123.1925,302.2146 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="123.1925,302.2146,131.0544,296.2825,125.6167,297.8416,124.0576,292.4038,123.1925,302.2146" style="stroke:#181818;stroke-width:1.0;"/><path d="M180.2446,254.895 C195.6643,268.4055 216.938,287.0454 234.2507,302.2146 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="234.2507,302.2146,230.1176,293.275,230.4901,298.9196,224.8455,299.292,234.2507,302.2146" style="stroke:#181818;stroke-width:1.0;"/><path d="M103.786,357.2349 C101.7212,368.8496 99.3029,382.4526 97.2356,394.0811 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="97.2356,394.0811,102.7491,385.9202,98.1108,389.1583,94.8726,384.5199,97.2356,394.0811" style="stroke:#181818;stroke-width:1.0;"/><path d="M266.857,357.2349 C267.8894,368.8496 269.0986,382.4526 270.1322,394.0811 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="270.1322,394.0811,273.3196,384.7623,269.6895,389.1007,265.3511,385.4706,270.1322,394.0811" style="stroke:#181818;stroke-width:1.0;"/><path d="M208.0156,235.7188 C214.1596,235.7188 220.3036,235.7188 226.4476,235.7188 " fill="none" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/><!--SRC=[TLDHQzj037xthz3wqWxYfbtJiNKmM4TNnjW82wmlVL4SnJvofpEdSpFlrq-oa-B21iRSdVHzf- -JxbMRi0u87llOPP106HaBsJbkCM60AeOsCd5UvTuJ9AeqeVPK5CyHE5cYo8xwHpxREgufjSdfSKomnOfc83rNj85r3-wpZzt68lSnAilh4q21TlU2xESNq5hQBYlVrHk5PP8PeDzZBv0R0i50i5MIt626ThpyG9MsKwxRhylowZq8qMO8ss8Ql_lr7OR2mtonE9s_lJYTspU_6BBfAKoJLvcynpG2LdVByXf6sENYdU46p6__0dFRYMCI6K5do54595NWymmY-nvo174rWsDRchmgiiIZDsltPyftZpakiOvWbMDLnOxD9eFf3U04N1Q8UwOquWyv_z8X0LF-FubLTMGHB8fs1sNvqHo66tYWzQSkDmpQhMD4IzM8jM_lSWDJhOMXB6TeWFs6dHdyl37dz61O7wlMin6czokTpf-h6vsixKW4y2D2soGKClFsoMdAHjNV34OU9aE7jYQLWZf7gknSOTz8Hycx9pBR0uMO-W_Q3fsgwVosn6gWfbzUby5nf-IYlNIH1uNsOD1UIWrOe-FpWdW3LkPV]--></g></svg>