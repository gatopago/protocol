name: Protocol CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1
      - run: pnpm contracts:install
      - run: cd contracts && forge fmt --check
      - run: pnpm contracts:build --sizes
      - run: pnpm contracts:test
      - name: Wallet gas snapshot
        run: cd contracts && forge snapshot --match-path test/wallet/GatoPagoWallet.t.sol --check
      - name: Account storage layout (upgrade compatibility)
        run: node scripts/storage-layout.mjs
      # Slither cannot build its IR for three OpenZeppelin functions the account inherits
      # (MultiSignerERC7913._validateSignatures, ERC7821.execute and supportsExecutionMode):
      # those are not analyzed. Any other function it cannot analyze fails the build.
      - name: Slither
        run: |
          pip install slither-analyzer==0.11.6
          cd contracts
          slither . --config-file slither.config.json --fail-medium 2>&1 | tee slither.log
          ! grep "Impossible to generate IR" slither.log |
            grep -vE "GatoPagoAccount\.(_validateSignatures|execute|supportsExecutionMode) \("
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm contracts:install && pnpm contracts:build
      - run: pnpm build
      - run: pnpm test
