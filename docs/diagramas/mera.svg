<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:613px;height:474px;background:#FFFFFF;" width="613px" height="474px" viewBox="0 0 613 474" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--entity pk--><g class="entity" data-qualified-name="pk" id="ent0001" data-source-line="4"><rect x="224" y="12" width="332.833" height="55.219" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="234" y="36.533" fill="#000" font-size="14" textLength="52.91">Passkey</text><text x="234" y="54.143" fill="#000" font-size="14" textLength="312.833">(huella o rostro, sincronizada por iCloud o Google)</text></g><!--entity prf--><g class="entity" data-qualified-name="prf" id="ent0002" data-source-line="5"><rect x="6" y="123" width="313.337" height="55.219" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="16" y="147.533" fill="#000" font-size="14" textLength="70.807">Salida PRF</text><text x="16" y="165.143" fill="#000" font-size="14" textLength="293.337">(32 bytes, siempre la misma para esa passkey)</text></g><!--entity seed--><g class="entity" data-qualified-name="seed" id="ent0003" data-source-line="6"><rect x="106" y="225.5" width="112.593" height="37.609" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="116" y="250.033" fill="#000" font-size="14" textLength="92.593">Semilla BIP-39</text></g><!--entity evm--><g class="entity" data-qualified-name="evm" id="ent0004" data-source-line="7"><rect x="52.5" y="311" width="113.632" height="55.219" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="62.5" y="335.533" fill="#000" font-size="14" textLength="67.696">Llave EVM</text><text x="62.5" y="353.143" fill="#000" font-size="14" textLength="93.632">m/44'/60'/0'/0/0</text></g><!--entity xlm--><g class="entity" data-qualified-name="xlm" id="ent0005" data-source-line="8"><rect x="196.5" y="311" width="142.418" height="55.219" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="206.5" y="335.533" fill="#000" font-size="14" textLength="77.041">Llave Stellar</text><text x="206.5" y="353.143" fill="#000" font-size="14" textLength="122.418">SEP-5 m/44'/148'/0'</text></g><!--entity biz--><g class="entity" data-qualified-name="biz" id="ent0006" data-source-line="9"><rect x="337.5" y="123" width="259.675" height="55.219" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="347.5" y="147.533" fill="#000" font-size="14" textLength="115.186">Llave de Negocios</text><text x="347.5" y="165.143" fill="#000" font-size="14" textLength="239.675">(otra sal, solo para entrar a la consola)</text></g><!--entity cuenta--><g class="entity" data-qualified-name="cuenta" id="ent0007" data-source-line="10"><rect x="6.5" y="403" width="166.31" height="55.219" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="16.5" y="427.533" fill="#000" font-size="14" textLength="146.31">Cuenta GatoPago EVM</text><text x="16.5" y="445.143" fill="#000" font-size="14" textLength="133.075">(la llave es su dueña)</text></g><!--entity sa--><g class="entity" data-qualified-name="sa" id="ent0008" data-source-line="11"><rect x="191" y="403" width="173.296" height="55.219" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="201" y="427.533" fill="#000" font-size="14" textLength="153.296">Smart account de Stellar</text><text x="201" y="445.143" fill="#000" font-size="14" textLength="144.717">(la llave es su firmante)</text></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="22"><path d="M237,215 L237,240.5 L219.293,244.5 L237,248.5 L237,274.055 A0,0 0 0 0 237,274.055 L521.764,274.055 A0,0 0 0 0 521.764,274.055 L521.764,225 L511.764,215 L237,215 A0,0 0 0 0 237,215" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M511.764,215 L511.764,225 L521.764,225 L511.764,215" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="243" y="233.495" fill="#000" font-size="13" textLength="258.711">Sin frase que anotar: la passkey la regenera.</text><text x="243" y="249.847" fill="#000" font-size="13" textLength="260.87">Las llaves viven en memoria; una huella abre</text><text x="243" y="266.198" fill="#000" font-size="13" textLength="263.764">una sesión de 15 minutos sin volver a pedirla.</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk9" data-link-type="dependency"><polygon points="218.232,122.856,228.077,122.583,222.743,120.699,224.627,115.365,218.232,122.856" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M335.016,67.025 C299.559,83.976 258.25,103.725 222.743,120.699" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="299.5" y="100.495" fill="#000" font-size="13" textLength="90.314">WebAuthn PRF</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0006" id="lnk10" data-link-type="dependency"><polygon points="448.591,122.733,446.666,113.074,445.706,118.649,440.131,117.69,448.591,122.733" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M409.336,67.164 C421.268,84.055 433.76,101.739 445.706,118.649" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="438.5" y="100.495" fill="#000" font-size="13" textLength="96.814">PRF con otra sal</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk11" data-link-type="dependency"><polygon points="162.5,225.398,166.5,216.398,162.5,220.398,158.5,216.398,162.5,225.398" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M162.5,178.11 C162.5,193.288 162.5,206.913 162.5,220.398" st