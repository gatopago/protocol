[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Every CREATE2 address derives from this bytecode: changing the compiler or its
# settings changes the addresses of future deployments.
solc = "0.8.34"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
# Metadata-free bytecode, so addresses do not depend on source paths or line endings.
bytecode_hash = "none"
cbor_metadata = false

[fmt]
line_length = 120
