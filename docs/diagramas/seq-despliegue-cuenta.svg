1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="39.072" y1="162.313" x2="356.942" y2="162.313" style="stroke:#181818;stroke-width:1;"/><text x="46.072" y="157.456" fill="#000" font-size="13" textLength="75.15">Crear cuenta</text><polygon points="808.328,188.664,818.328,192.664,808.328,196.664,812.328,192.664" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="362.942" y1="192.664" x2="814.328" y2="192.664" style="stroke:#181818;stroke-width:1;"/><text x="369.942" y="187.808" fill="#000" font-size="13" textLength="281.811">factory.getAddress(dueños): solo lectura, sin gas</text><polygon points="50.072,219.016,40.072,223.016,50.072,227.016,46.072,223.016" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="44.072" y1="223.016" x2="361.942" y2="223.016" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="56.072" y="218.159" fill="#000" font-size="13" textLength="299.87">su dirección (y su dirección Stellar, que sale de ella)</text><rect x="10" y="252.191" width="1306.219" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="252.191" x2="1316.219" y2="252.191" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="255.191" x2="1316.219" y2="255.191" style="stroke:#000;stroke-width:1;"/><rect x="531.492" y="241.016" width="263.234" height="24.352" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="537.492" y="258.511" fill="#000" font-size="13" textLength="245.623" font-weight="700">2. Recibir dinero: tampoco se despliega</text><polygon points="808.328,293.719,818.328,297.719,808.328,301.719,812.328,297.719" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="431.593" y1="297.719" x2="814.328" y2="297.719" style="stroke:#181818;stroke-width:1;"/><text x="438.593" y="292.862" fill="#000" font-size="13" textLength="182.8">transfer de USDC a la dirección</text><path d="M616.157,310.719 L616.157,352.719 L1024.157,352.719 L1024.157,320.719 L1014.157,310.719 L616.157,310.719" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1014.157,310.719 L1014.157,320.719 L1024.157,320.719 L1014.157,310.719" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="622.157" y="329.214" fill="#000" font-size="13" textLength="387.34">El saldo queda en el contrato de USDC a nombre de esa dirección.</text><text x="622.157" y="345.565" fill="#000" font-size="13" textLength="307.106">La cuenta sigue sin código: recibir no necesita firmar.</text><polygon points="1133.712,376.773,1143.712,380.773,1133.712,384.773,1137.712,380.773" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="431.593" y1="380.773" x2="1139.712" y2="380.773" style="stroke:#181818;stroke-width:1;"/><text x="438.593" y="375.917" fill="#000" font-size="13" textLength="198.688">USDC o XLM a la dirección Stellar</text><path d="M980.205,393.773 L980.205,419.773 L1311.205,419.773 L1311.205,403.773 L1301.205,393.773 L980.205,393.773" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1301.205,393.773 L1301.205,403.773 L1311.205,403.773 L1301.205,393.773" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="986.205" y="412.269" fill="#000" font-size="13" textLength="310.013">Igual en Stellar: el saldo vive en el contrato del activo.</text><rect x="10" y="446.301" width="1306.219" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="446.301" x2="1316.219" y2="446.301" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="449.301" x2="1316.219" y2="449.301" style="stroke:#000;stroke-width:1;"/><rect x="465.73" y="435.125" width="394.758" height="24.352" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="471.73" y="452.62" fill="#000" font-size="13" textLength="377.146" font-weight="700">3. Primera vez que saca dinero en una red EVM: se despliega</text><polygon points="350.942,487.828,360.942,491.828,350.942,495.828,354.942,491.828" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="39.072" y1="491.828" x2="356.942" y2="491.828" style="stroke:#181818;stroke-width:1;"/><text x="46.072" y="486.972" fill="#000" font-size="13" textLength="135.846">enviar, pagar, ahorrar...</text><polygon points="616.667,518.18,626.667,522.18,616.667,526.18,620.667,522.18" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="362.942" y1="522.18" x2="622.667" y2="522.18" style="stroke:#181818;stroke-width:1;"/><text x="369.942" y="517.323" fill="#000" font-size="13" textLength="241.725">operación con initCode (factory + dueños)</text><polygon points="808.328,548.531,818.328,552.531,808.328,556.531,812.328,552.531" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="628.667" y1="552.531" x2="814.328" y2="552.531" style="stroke:#181818;stroke-width:1;"/><text x="635.667" y="547.675" fill="#000" font-size="13" textLength="167.661">handleOps (gas patrocinado)</text><line x1="820.328" y1="599.234" x2="862.328" y2="599.234" style="stroke:#181818;stroke-width:1;"/><line x1="862.328" y1="599.234" x2="862.328" y2="612.234" style="stroke:#181818;stroke-width:1;"/><line x1="821.328" y1="612.234" x2="862.328" y2="612.234" style="stroke:#181818;stroke-width:1;"/><polygon points="831.328,608.234,821.328,612.234,831.328,616.234,827.328,612.234" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="827.328" y="578.026" fill="#000" font-size="13" textLength="311.384">la factory crea la cuenta (CREATE2, misma dirección)</text><text x="827.328" y="594.378" fill="#000" font-size="13" textLength="270.251">y en la misma transacción ejecuta la operación</text><rect x="10" y="641.41" width="1306.219" height="3" fill="#EEE" 